plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp' // Using KSP for Room
}

android {
    namespace 'com.example.moneymanager'
    compileSdk 34

    defaultConfig {
        applicationId "com.kaustubhtripathi.jaruri"
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName "1.7.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    packaging {
        jniLibs {
            // Listener transcription (Vosk): compress native libs in the APK and
            // ship ARM only. x86/x86_64 libvosk (~20 MB) would only serve emulators,
            // where transcription reports "unavailable" instead.
            useLegacyPackaging = true
            excludes += ['lib/x86/libvosk.so', 'lib/x86_64/libvosk.so']
            // JNA (only used by Vosk): no use without libvosk, and mips/armeabi
            // are ABIs no minSdk-24 device runs.
            excludes += ['lib/x86/libjnidispatch.so', 'lib/x86_64/libjnidispatch.so',
                         'lib/mips/**', 'lib/mips64/**', 'lib/armeabi/**']
        }
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += 'META-INF/DEPENDENCIES'
            excludes += 'META-INF/LICENSE'
            excludes += 'META-INF/LICENSE.txt'
            excludes += 'META-INF/license.txt'
            excludes += 'META-INF/NOTICE'
            excludes += 'META-INF/NOTICE.txt'
            excludes += 'META-INF/notice.txt'
        }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}



dependencies {
    def room_version = "2.6.1"
    def nav_version = "2.7.7"
    def lifecycle_version = "2.7.0"

    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    
    // Architecture Components (Room, Lifecycle, Navigation)
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"      

    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.fragment:fragment-ktx:1.6.2"
    
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"
    
    // Charting
    implementation "com.github.PhilJay:MPAndroidChart:v3.1.0"
    
    // DataStore
    implementation "androidx.datastore:datastore-preferences:1.0.0"

    // Listener: offline speech-to-text (Apache-2.0; native libs from Maven, model imported by the user)
    implementation "com.alphacephei:vosk-android:0.3.75"
    // Listener: resumable background transcription
    implementation "androidx.work:work-runtime-ktx:2.9.1"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.5.1'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'androidx.test.ext:junit:1.1.5'
    testImplementation 'org.robolectric:robolectric:4.10.3'
    testImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    testImplementation "androidx.navigation:navigation-testing:$nav_version"
    testImplementation "androidx.work:work-testing:2.9.1"
    debugImplementation "androidx.fragment:fragment-testing:1.6.2"

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
