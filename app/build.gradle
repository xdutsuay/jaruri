plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp' // Using KSP for Room
}

// Bundle StevenBlack's unified list (personal use) for Tunnel? Default yes.
// The permissive list is always bundled. Publishable builds (F-Droid) pass
// -Pjaruri.tunnel.unifiedList=false. See docs/tunnel.md "Licences".
def tunnelUnifiedList = (project.findProperty("jaruri.tunnel.unifiedList") ?: "true").toString().toBoolean()

// Bundle the Listener speech models (Vosk small, Apache-2.0) as assets? Default yes.
// They are downloaded once at build time into <repo>/.cache/stt-models (not in git)
// and must match the pinned SHA-256. F-Droid can't download during a build, so it
// passes -Pjaruri.stt.bundleModels=false; users then import a model by hand.
def sttBundleModels = (project.findProperty("jaruri.stt.bundleModels") ?: "true").toString().toBoolean()
def sttModels = [
    "vosk-model-small-en-in-0.4": "20663dcac4d5cb783a579c54d98339344a688e4ec6e1b4a4b059fd1235454cc7",
    "vosk-model-small-hi-0.22"  : "7c50a10866889f0ac21d912c20537a055a597ed09fc1d3e5bcd798f9f0017e48",
]

abstract class FetchSttModels extends DefaultTask {
    @Input abstract MapProperty<String, String> getModels()
    @Internal abstract DirectoryProperty getCacheDir()
    @OutputDirectory abstract DirectoryProperty getOutputDir()

    @TaskAction
    void fetch() {
        def cache = cacheDir.get().asFile
        def out = new File(outputDir.get().asFile, "stt")
        outputDir.get().asFile.deleteDir()
        out.mkdirs()
        models.get().each { name, sha ->
            def zip = new File(cache, "${name}.zip")
            if (!zip.isFile() || sha256(zip) != sha) {
                cache.mkdirs()
                def tmp = new File(cache, "${name}.zip.part")
                logger.lifecycle("Downloading speech model $name")
                new URL("https://alphacephei.com/vosk/models/${name}.zip").withInputStream { i ->
                    tmp.withOutputStream { it << i }
                }
                def got = sha256(tmp)
                if (got != sha) {
                    tmp.delete()
                    throw new GradleException("$name: SHA-256 mismatch (got $got, want $sha)")
                }
                zip.delete()
                tmp.renameTo(zip)
            }
            java.nio.file.Files.copy(zip.toPath(), new File(out, "${name}.zip").toPath())
        }
    }

    static String sha256(File f) {
        def md = java.security.MessageDigest.getInstance("SHA-256")
        f.withInputStream { i ->
            byte[] buf = new byte[1 << 16]
            int n
            while ((n = i.read(buf)) > 0) md.update(buf, 0, n)
        }
        md.digest().encodeHex().toString()
    }
}

def fetchSttModels = tasks.register("fetchSttModels", FetchSttModels) {
    models.set(sttModels)
    cacheDir.set(rootProject.layout.projectDirectory.dir(".cache/stt-models"))
    outputDir.set(layout.buildDirectory.dir("generated/sttModels"))
}

androidComponents {
    onVariants(selector().all()) { variant ->
        if (sttBundleModels) {
            variant.sources.assets?.addGeneratedSourceDirectory(fetchSttModels) { it.outputDir }
        }
    }
}

android {
    namespace 'com.example.moneymanager'
    compileSdk 34

    defaultConfig {
        applicationId "com.kaustubhtripathi.jaruri"
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName "1.7.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // StevenBlack's unified list includes non-commercial / share-alike sources.
        buildConfigField "boolean", "TUNNEL_UNIFIED_LIST", tunnelUnifiedList.toString()
    }

    sourceSets {
        if (tunnelUnifiedList) {
            main.assets.srcDirs += "src/tunnelUnified/assets"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    androidResources {
        // Bundled speech models are read as zip streams; recompressing gains nothing.
        noCompress += 'zip'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
    packaging {
        jniLibs {
            // Listener transcription (Vosk): compress native libs in the APK and
            // ship ARM only. x86/x86_64 libvosk (~20 MB) would only serve emulators,
            // where transcription reports "unavailable" instead.
            useLegacyPackaging = true
            excludes += ['lib/x86/libvosk.so', 'lib/x86_64/libvosk.so']
            // JNA (only used by Vosk): no use without libvosk, and mips/armeabi
            // are ABIs no minSdk-24 device runs.
            excludes += ['lib/x86/libjnidispatch.so', 'lib/x86_64/libjnidispatch.so',
                         'lib/mips/**', 'lib/mips64/**', 'lib/armeabi/**']
        }
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += 'META-INF/DEPENDENCIES'
            excludes += 'META-INF/LICENSE'
            excludes += 'META-INF/LICENSE.txt'
            excludes += 'META-INF/license.txt'
            excludes += 'META-INF/NOTICE'
            excludes += 'META-INF/NOTICE.txt'
            excludes += 'META-INF/notice.txt'
        }
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // Real SQLite on every host; the legacy shim breaks Room's IO threads on Windows.
                systemProperty 'robolectric.sqliteMode', 'NATIVE'
                // A stuck test should fail the build, not hang it.
                timeout = java.time.Duration.ofMinutes(15)
                // The app keeps process-wide singletons (Room, DataStore, main dispatcher);
                // a fresh JVM per test class stops one class's state leaking into the next.
                forkEvery = 1
                maxParallelForks = Math.max(1, (int) (Runtime.runtime.availableProcessors() / 2))
            }
        }
    }
}



dependencies {
    def room_version = "2.6.1"
    def nav_version = "2.7.7"
    def lifecycle_version = "2.7.0"

    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    
    // Architecture Components (Room, Lifecycle, Navigation)
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"      

    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.fragment:fragment-ktx:1.6.2"
    
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"
    
    // Charting
    implementation "com.github.PhilJay:MPAndroidChart:v3.1.0"
    
    // DataStore
    implementation "androidx.datastore:datastore-preferences:1.1.1"

    // Listener: offline speech-to-text (Apache-2.0; native libs from Maven, models bundled as assets)
    implementation "com.alphacephei:vosk-android:0.3.75"
    // Listener: resumable background transcription
    implementation "androidx.work:work-runtime-ktx:2.9.1"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.5.1'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'androidx.test.ext:junit:1.1.5'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    testImplementation "androidx.navigation:navigation-testing:$nav_version"
    testImplementation "androidx.work:work-testing:2.9.1"
    debugImplementation "androidx.fragment:fragment-testing:1.6.2"

    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
